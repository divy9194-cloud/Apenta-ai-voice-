name: Build Penta APK

on:
  workflow_dispatch:

env:
  DEFINES: >-
    --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
    --dart-define=YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
    --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
    --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
    --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
    --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add character picture
        run: |
          mkdir -p assets
          f=$(ls boy.jpg boy.png *.jpg *.jpeg *.png 2>/dev/null | head -n 1)
          if [ -z "$f" ]; then
            echo "No picture found. Upload the character picture (jpg) to the main folder of the repo."
            exit 1
          fi
          echo "Using $f"
          cp "$f" assets/boy.jpg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter create /tmp/scaffold --platforms=android --org com.divyanshu --project-name penta
          cp -r /tmp/scaffold/android ./android
          cp -r overlay/android/. android/
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

      - name: Get packages
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug $DEFINES > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=========== ERRORS ==========="
            grep -n -B2 -A12 -E "What went wrong|Error:|error:|^e: " build.log | head -120
            exit 1
          fi
          tail -5 build.log

      - name: Build release APK
        run: flutter build apk --release $DEFINES

      - uses: actions/upload-artifact@v4
        with:
          name: penta-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
